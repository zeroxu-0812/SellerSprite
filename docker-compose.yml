services:
  sellersprite:
    build:
      context: .
    image: sellersprite-competitor:latest
    env_file:
      - .env
    environment:
      SELLERSPRITE_BIND: 0.0.0.0:8787
    ports:
      - "8787:8787"
    volumes:
      - ./output:/app/output
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - sellersprite
